name: Update Homebrew tap

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
    branches-ignore: []

jobs:
  update-tap:
    name: Bump Homebrew formula
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Extract version from triggering tag
        id: version
        run: |
          REF="${{ github.event.workflow_run.head_branch }}"
          # handle both "v1.2.3" tag refs and branch refs
          VERSION="${REF#refs/tags/v}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch sdist and compute SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://files.pythonhosted.org/packages/source/s/symphony/symphony-${VERSION}.tar.gz"
          curl -fsSL "${URL}" -o symphony.tar.gz
          SHA=$(sha256sum symphony.tar.gz | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: codatta/homebrew-symphony
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha256.outputs.sha256 }}"
          URL="${{ steps.sha256.outputs.url }}"
          mkdir -p tap/Formula
          cat > tap/Formula/symphony.rb << FORMULA
          class Symphony < Formula
            desc "AI agent orchestration service — turn Linear issues into isolated agent runs"
            homepage "https://github.com/codatta/symphony"
            url "${URL}"
            sha256 "${SHA}"
            version "${VERSION}"
            license "Apache-2.0"

            depends_on "python@3.12"

            def install
              venv = virtualenv_create(libexec, "python3.12")
              venv.pip_install_and_link_scripts(buildpath)
            end

            test do
              system "#{bin}/symphony", "--version"
            end
          end
          FORMULA

      - name: Commit and push formula update
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/symphony.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "bump symphony to ${{ steps.version.outputs.version }}"
          git push
