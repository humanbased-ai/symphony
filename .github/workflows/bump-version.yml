name: bump-version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    # Skip if this push is itself a version bump to avoid infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version in pyproject.toml
        id: bump
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(version\s*=\s*")(\d+)\.(\d+)\.(\d+)\.(\d+)(")', text)
          if not m:
              raise SystemExit("Could not find version in pyproject.toml")
          major, minor, patch, build = m.group(2), m.group(3), m.group(4), int(m.group(5))
          new_version = f"{major}.{minor}.{patch}.{build + 1}"
          new_text = text[:m.start()] + f'{m.group(1)}{new_version}{m.group(6)}' + text[m.end():]
          Path("pyproject.toml").write_text(new_text, encoding="utf-8")
          print(f"Bumped to {new_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_version}\n")
          PY

      - name: Find merged PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            -H "Accept: application/vnd.github.groot-preview+json" 2>/dev/null || echo "[]")
          PR_NUMBER=$(echo "$PR_JSON" | python3 -c "
          import sys, json
          prs = json.load(sys.stdin)
          print(prs[0]['number'] if prs else '')
          ")
          if [ -z "$PR_NUMBER" ]; then
            echo "has_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_pr=true" >> $GITHUB_OUTPUT
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "$PR_JSON" | python3 -c "
          import sys, json
          prs = json.load(sys.stdin)
          pr = prs[0]
          print(pr['title'])
          " > /tmp/pr_title.txt
          echo "$PR_JSON" | python3 -c "
          import sys, json
          prs = json.load(sys.stdin)
          pr = prs[0]
          print(pr['html_url'])
          " > /tmp/pr_url.txt
          echo "$PR_JSON" | python3 -c "
          import sys, json
          prs = json.load(sys.stdin)
          pr = prs[0]
          print(pr['body'] or '')
          " > /tmp/pr_body.txt

      - name: Update CHANGELOG.md
        if: steps.pr.outputs.has_pr == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import date
          import os

          version = os.environ["VERSION"]
          pr_number = os.environ["PR_NUMBER"]
          pr_title = Path("/tmp/pr_title.txt").read_text().strip()
          pr_url = Path("/tmp/pr_url.txt").read_text().strip()
          pr_body = Path("/tmp/pr_body.txt").read_text().strip()
          today = date.today().isoformat()

          new_section = (
              f"## v{version} — {today}\n\n"
              f"**[PR #{pr_number}]({pr_url})**: {pr_title}\n\n"
              f"{pr_body}\n\n"
              f"---\n\n"
          )

          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")

          # Insert before the first ## heading
          lines = content.split("\n")
          insert_idx = next(
              (i for i, l in enumerate(lines) if l.startswith("## ")), len(lines)
          )
          before = "\n".join(lines[:insert_idx]).rstrip("\n") + "\n\n"
          after = "\n".join(lines[insert_idx:])
          changelog.write_text(before + new_section + after, encoding="utf-8")
          print(f"CHANGELOG.md updated with v{version}")
          PY
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git add CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push
