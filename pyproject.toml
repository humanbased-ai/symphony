[project]
name = "symphony"
version = "0.1.0"
description = "Python implementation of the Symphony agent orchestration service"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "jinja2>=3.1",
  "keyring>=24.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "watchfiles>=0.21",
]

[project.urls]
Repository = "https://github.com/codatta/symphony"
Issues = "https://github.com/codatta/symphony/issues"

[project.scripts]
symphony = "symphony.cli:main"
sy = "symphony.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["symphony*"]
exclude = ["elixir*"]

[tool.unittest]
start-dir = "tests"
pattern = "test_*.py"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
